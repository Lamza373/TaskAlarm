n
name: Build TaskAlarm APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TaskAlarmAndroid_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip TaskAlarmAndroid_source.zip -d source

      - name: Fix Java and Kotlin versions
        run: |
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }' source/app/build.gradle.kts

      - name: Build APK
        run: gradle -p source assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TaskAlarm-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
